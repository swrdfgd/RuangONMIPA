<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang ONMIPA</title>
    
    <!-- Memuat Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Konfigurasi Tema Tailwind (Warna & Font) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            900: '#064e3b',
                            950: '#022c22',
                        },
                        amber: {
                            500: '#f59e0b',
                            600: '#d97706',
                        },
                        paper: '#fdfbf7', /* Warna background kertas klasik */
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Memuat Google Fonts: Playfair Display (Serif) & Inter (Sans-Serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Custom CSS untuk transisi Accordion dan pernak-pernik klasik -->
    <style>
        body {
            background-color: theme('colors.paper');
        }
        
        /* Animasi buka tutup akordion */
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            opacity: 0;
        }
        .accordion-content.open {
            max-height: 1500px; /* Angka arbitrer besar agar cukup menampung konten */
            opacity: 1;
        }

        /* Ikon panah yang bisa berputar */
        .chevron {
            transition: transform 0.3s ease;
        }
        .chevron.rotate {
            transform: rotate(180deg);
        }

        /* Styling klasik tambahan */
        .border-classic {
            border: 1px solid theme('colors.emerald.900');
            box-shadow: 4px 4px 0px 0px theme('colors.emerald.900');
            transition: all 0.2s ease;
        }
        .border-classic:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px 0px theme('colors.emerald.900');
        }
        
        .tab-btn {
            position: relative;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: theme('colors.amber.500');
        }
    </style>
</head>
<body class="font-sans text-emerald-950 min-h-screen flex flex-col">

    <!-- Header Klasik Institusional -->
    <header class="bg-emerald-900 text-white pt-16 pb-12 px-6 text-center border-b-4 border-amber-600 shadow-lg relative overflow-hidden">
        <!-- Ornamen background tipis -->
        <div class="absolute inset-0 opacity-5" style="background-image: repeating-linear-gradient(45deg, #000 0, #000 2px, transparent 2px, transparent 8px);"></div>
        
        <div class="max-w-4xl mx-auto relative z-10">
            <h1 class="font-serif text-4xl md:text-5xl lg:text-6xl font-bold mb-4 tracking-wide text-amber-50">Ruang ONMIPA</h1>
            <p class="text-lg md:text-xl text-emerald-100 font-light max-w-2xl mx-auto italic font-serif">
                Arsip Naskah Soal & Pembahasan ONMIPA Matematika
            </p>
            <div class="mt-8 flex justify-center items-center opacity-75">
                <div class="w-12 h-px bg-amber-500"></div>
                <div class="mx-3 text-amber-500 font-serif text-2xl">❧</div>
                <div class="w-12 h-px bg-amber-500"></div>
            </div>
        </div>
    </header>

    <!-- Kontainer Aplikasi Utama (Dirender oleh JS) -->
    <main class="flex-grow max-w-4xl mx-auto w-full px-4 sm:px-6 py-10" id="app-container">
        <!-- Konten akan dimasukkan ke sini oleh JavaScript -->
    </main>

    <!-- Footer -->
    <footer class="bg-emerald-950 text-emerald-200/60 py-8 text-center mt-12">
        <div class="max-w-4xl mx-auto px-6">
        </div>
    </footer>

    <!-- Logika Aplikasi (Vanilla JS) -->
    <script>
        // 1. STRUKTUR DATA (Disesuaikan dengan kebutuhan variasi format tahun)
        const dbONMIPA = {
            "Wilayah": [
                {
                    year: 2026,
                    categories: [
                        { name: "Hari Kedua", questions: [
															{name: '<span class="text-yellow-800 hover:text-amber-400">Uraian No. 4</span><span class="group relative inline-block cursor-help text-[10px] align-super text-emerald-700 ml-0.5">[AL]<span class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1.5 opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none w-max bg-emerald-950 text-amber-50 text-xs font-normal py-1 px-2.5 rounded shadow-lg z-50 border border-amber-600/50 font-sans tracking-wide">Aljabar Linear</span></span>', link:'2026/wilayah-harikedua-uraian-4.html'},
															]
						}
                    ]
                },
                {
                    year: 2022,
                    categories: [
                        { name: "Hari Pertama", questions: [
															{name: '<span class="text-yellow-800 hover:text-amber-400">Uraian No. 2</span><span class="group relative inline-block cursor-help text-[10px] align-super text-emerald-700 ml-0.5">[AR]<span class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1.5 opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none w-max bg-emerald-950 text-amber-50 text-xs font-normal py-1 px-2.5 rounded shadow-lg z-50 border border-amber-600/50 font-sans tracking-wide">Analisis Real</span></span>', link:'2022/wilayah-haripertama-uraian-2.html'},
															]
						}
                    ]
                },
                {
                    year: 2021,
                    categories: [
                        { name: "Hari Pertama", questions: [
															{name: '<span class="text-yellow-800 hover:text-amber-400">Uraian No. 3</span><span class="group relative inline-block cursor-help text-[10px] align-super text-emerald-700 ml-0.5">[SA]<span class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1.5 opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none w-max bg-emerald-950 text-amber-50 text-xs font-normal py-1 px-2.5 rounded shadow-lg z-50 border border-amber-600/50 font-sans tracking-wide">Struktur Aljabar</span></span>', link:'2021/wilayah-haripertama-uraian-3.html'},
															]
						}
                    ]
                },
                {
                    year: 2020,
                    categories: [
                        { name: "Hari Kedua", questions: [
															{name: 'Isian No. 3<span class="group relative inline-block cursor-help text-[10px] align-super text-emerald-700 ml-0.5">[K]<span class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1.5 opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none w-max bg-emerald-950 text-amber-50 text-xs font-normal py-1 px-2.5 rounded shadow-lg z-50 border border-amber-600/50 font-sans tracking-wide">Kombinatorika</span></span>', link:'2020/wilayah-harikedua-isian-3.html'},
															]
						},
                    ]
                },
                {
                    year: 2018,
                    categories: [
                        { name: "Analisis Kompleks", questions: [
															{name: 'Isian No. 4', link:'2018/wilayah-analisiskompleks-isian-4.html'},
															]
						},
						{ name: "Analisis Riil", questions: [
															{name: 'Isian No. 8', link:'2018/wilayah-analisisreal-isian-8.html'},
															]
						},
                    ]
                },
                {
                    year: 2016,
                    categories: [
                        { name: "Analisis Real", questions: [
															{name: '<span class="text-yellow-800 hover:text-amber-400">Bag.2 No. 1</span>', link:'2016/wilayah-analisisreal-bagian kedua-1.html'},
															]
						}
                    ]
                },
                {
                    year: 2012,
                    categories: [
                        { name: "Analisis Kompleks", questions: [
															{name: 'Bag.1 No. 4', link:'2012/wilayah-analisiskompleks-bagian pertama-4.html'},
															]
						}
                    ]
                },
                {
                    year: 2011,
                    categories: [
                        { name: "Kombinatorika", questions: [
															{name: 'Bag.1 No. 2', link:'2011/wilayah-kombinatorika-bagian pertama-2.html'},
															{name: 'Bag.1 No. 3', link:'2011/wilayah-kombinatorika-bagian pertama-3.html'},
															]
						},
						{ name: "Analisis Kompleks", questions: [
															{name: '<span class="text-yellow-800 hover:text-amber-400">Bag.2 No. 2</span>', link:'2011/wilayah-analisiskompleks-bagian kedua-2.html'},
															]
						}
                    ]
                },
                {
                    year: 2010,
                    categories: [
                        { name: "Aljabar Linear", questions: [
															{name: '<span class="text-yellow-800 hover:text-amber-400">Bag. 2 No. 3</span>', link:'2010/wilayah-aljabarlinear-bagian kedua-3.html'},
															]
						},
                        { name: "Analisis Kompleks", questions: [
															{name: 'Bag. 1 No. 5', link:'2010/wilayah-analisiskompleks-bagian pertama-5.html'},
															]
						}
                    ]
                },
                {
                    year: 2007,
                    categories: [
                        { name: "Struktur Aljabar", questions: [
															{name: '<span class="text-yellow-800 hover:text-amber-400">Bag.2 No. 1</span>', link:'2007/wilayah-strukturaljabar-bagian kedua-1.html'},
															]
						},
                        { name: "Aljabar Linear", questions: [
															{name: '<span class="text-yellow-800 hover:text-amber-400">Bag.2 No. 3</span>', link:'2007/wilayah-aljabarlinear-bagian kedua-3.html'},
															]
						},
                    ]
                },
                {
                    year: 2006,
                    categories: [
                        { name: "Struktur Aljabar", questions: [
															{name: '<span class="text-yellow-800 hover:text-amber-400">Bag.2 No. 1</span>', link:'2007/wilayah-strukturaljabar-bagian kedua-1.html'},
															]
						},
                        { name: "Aljabar Linear", questions: [
															{name: 'Bag.1 No. 2', link:'2006/wilayah-aljabarlinear-bagian pertama-2.html'},
															]
						},
                    ]
                },
            ],
            /*"Nasional": [
                {
                    year: 2025,
                    formatLabel: "Berdasarkan Hari (Langsung Nomor)",
                    categories: [
                        { name: "Hari 1", questions: [1, 2, 3, 4, 5, 6] },
                        { name: "Hari 2", questions: [1, 2, 3, 4, 5, 6] }
                    ]
                },
                {
                    year: 2023,
                    formatLabel: "Campuran / Format Khusus",
                    categories: [
                        { name: "Sesi Pagi", questions: [1, 2, 3] },
                        { name: "Sesi Siang", questions: [4, 5, 6] }
                    ]
                }
            ]*/
        };

        // 2. STATE APLIKASI
        let state = {
            activeTab: 'Wilayah',
            expandedYears: {}, // Simpan status buka/tutup tingkat Tahun
            expandedCategories: {} // Simpan status buka/tutup tingkat Bidang/Hari
        };

        // 3. FUNGSI RENDER UTAMA
        function renderApp() {
            const container = document.getElementById('app-container');
            
            let html = `
                <!-- TINGKAT 1: Tabs Navigasi Wilayah vs Nasional -->
                <div class="flex flex-wrap justify-center border-b border-emerald-900/20 mb-8 font-serif text-lg">
                    <button onclick="setTab('Wilayah')" class="tab-btn px-6 py-3 transition-colors ${state.activeTab === 'Wilayah' ? 'text-emerald-900 font-bold active' : 'text-emerald-900/60 hover:text-emerald-900'}">
                        Tingkat Wilayah
                    </button>
                    <button onclick="setTab('Nasional')" class="tab-btn px-6 py-3 transition-colors ${state.activeTab === 'Nasional' ? 'text-emerald-900 font-bold active' : 'text-emerald-900/60 hover:text-emerald-900'}">
                        Tingkat Nasional
                    </button>
                </div>

                <!-- Kontainer Daftar Tahun -->
                <div class="space-y-4">
            `;

            const currentData = dbONMIPA[state.activeTab] || [];
            
            if (currentData.length === 0) {
                html += `<div class="text-center py-10 text-emerald-900/50 italic font-serif">Data belum tersedia untuk tingkat ini.</div>`;
            }

            // TINGKAT 2: Iterasi Tahun
            currentData.forEach((yearData, yIndex) => {
                const isYearOpen = !!state.expandedYears[yearData.year];
                
                html += `
                <div class="bg-white rounded-lg shadow-sm border border-emerald-900/10 overflow-hidden">
                    <!-- Header Accordion Tahun -->
                    <button onclick="toggleYear(${yearData.year})" class="w-full px-6 py-4 flex justify-between items-center bg-emerald-50/50 hover:bg-emerald-50 transition-colors">
                        <div class="flex items-center gap-3">
                            <span class="font-serif text-2xl font-bold text-emerald-900">${yearData.year}</span>
                        </div>
                        <svg class="w-6 h-6 text-emerald-700 chevron ${isYearOpen ? 'rotate' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>

                    <!-- Konten Accordion Tahun (Tingkat 3: Kategori/Bidang) -->
                    <div class="accordion-content ${isYearOpen ? 'open' : ''}">
                        <div class="p-4 sm:p-6 bg-white border-t border-emerald-900/10 space-y-3">
                `;

                yearData.categories.forEach((catData, cIndex) => {
                    const catId = `${yearData.year}_${cIndex}`;
                    const isCatOpen = !!state.expandedCategories[catId];
                    
                    html += `
                            <div class="border border-emerald-900/20 rounded-md bg-paper">
                                <!-- Header Accordion Kategori -->
                                <button onclick="toggleCategory('${catId}')" class="w-full px-5 py-3 flex justify-between items-center hover:bg-amber-50/50 transition-colors">
                                    <span class="font-serif font-semibold text-lg text-emerald-800">${catData.name}</span>
                                    <svg class="w-5 h-5 text-amber-600 chevron ${isCatOpen ? 'rotate' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </button>
                                
                                <!-- Konten Accordion Kategori (Tingkat 4: Nomor Soal) -->
                                <div class="accordion-content ${isCatOpen ? 'open' : ''}">
                                    <div class="p-5 border-t border-emerald-900/10 bg-white">
                                        <p class="text-sm text-emerald-900/60 mb-3 font-medium">Pilih Nomor Soal:</p>
                                        <div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-3">
                    `;

                    // Generate Tombol Soal
                    catData.questions.forEach(qNum => {
                        html += `
                                            <a href="${qNum.link}" target="_blank"
                                               class="border-classic bg-white text-emerald-900 hover:bg-emerald-900 hover:text-amber-400 font-semibold py-2 rounded text-center transition-all">
                                                ${qNum.name}
                                            </a>
                        `;
                    });

                    html += `
                                        </div>
                                    </div>
                                </div>
                            </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        // 4. HANDLER INTERAKSI
        
        // Pindah Tab Wilayah/Nasional
        window.setTab = function(tabName) {
            if(state.activeTab !== tabName) {
                state.activeTab = tabName;
                // Opsional: Tutup semua akordion saat pindah tab agar rapi
                state.expandedYears = {};
                state.expandedCategories = {};
                renderApp();
            }
        };

        // Buka/Tutup Akordion Tahun
        window.toggleYear = function(year) {
            state.expandedYears[year] = !state.expandedYears[year];
            renderApp();
        };

        // Buka/Tutup Akordion Kategori (Bidang/Hari)
        window.toggleCategory = function(catId) {
            state.expandedCategories[catId] = !state.expandedCategories[catId];
            renderApp();
        };

        // 5. INISIALISASI
        document.addEventListener('DOMContentLoaded', () => {
            // Buka tahun pertama secara default agar layar tidak kosong
            const firstYear = dbONMIPA[state.activeTab][0].year;
            state.expandedYears[firstYear] = true;
            
            renderApp();
        });

    </script>
</body>
</html>
